mqtt {
    property_size = 32
    max_packet_size = 2MB
    max_mqueue_len = 2048
    retry_interval = 10s
    keepalive_multiplier = 1.25

    listener.tcp {
        bind = "0.0.0.0:1883"
    }
}

http_server {
    enable = true
    port = 8081
}

auth {
    allow_anonymous = false
    username = "avi"
    password = "__MQTT_PASSWORD__"
}
